name: Android Safety Companion

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/android-safety-companion
    paths:
      - "android-safety-companion/**"
      - "windows-installer/**"
      - "docs/OFFLINE-INSTALLERS.md"
      - ".github/workflows/android-safety-companion.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon -p android-safety-companion assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-card-safety-debug-apk
          path: android-safety-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

name: Student ID OS CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub-only static site
        run: |
          test -s site/index.html
          ! grep -Eiq 'DATABASE_URL|NEON_AUTH_COOKIE_SECRET|OPENAI_API_KEY|student_number|guardian_phone' site/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test --if-present
      - run: npm run build

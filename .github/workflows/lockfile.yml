name: Reproducible npm lockfile
on:
  push:
    branches: [audit/commercial-readiness-gates]
    paths-ignore:
      - "package-lock.json"
      - "**.md"
      - "docs/**"
permissions:
  contents: write
concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate reproducible dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Commit lockfile if it changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add reproducible npm lockfile"
          git push origin "HEAD:${{ github.ref_name }}"

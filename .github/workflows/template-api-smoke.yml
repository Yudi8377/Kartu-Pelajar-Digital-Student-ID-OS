name: Template API Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/designer/**"
      - "site/js/card-studio.js"
      - ".github/workflows/template-api-smoke.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check template API CRUD and publish flow
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';

          const base = 'https://br-late-meadow-b3vj6rqi-cardtemplates.compute.c-4.ap-southeast-1.aws.neon.tech';
          const key = randomBytes(32).toString('base64url');
          const request = async (path, options = {}) => {
            const headers = {
              accept: 'application/json',
              'x-workspace-key': key,
              ...(options.body ? { 'content-type': 'application/json' } : {}),
              ...options.headers,
            };
            const response = await fetch(base + path, { ...options, headers, cache: 'no-store' });
            const text = await response.text();
            let data;
            try { data = text ? JSON.parse(text) : {}; } catch { data = { raw: text.slice(0, 300) }; }
            if (!response.ok) throw new Error(`${options.method || 'GET'} ${path} failed: HTTP ${response.status} ${JSON.stringify(data)}`);
            return data;
          };

          let id;
          try {
            const health = await request('/health');
            if (health.ok !== true) throw new Error('Health endpoint did not return ok=true');

            const template = {
              schemaVersion: 1,
              id: 'smoke-test',
              name: 'Automated API Smoke Test',
              category: 'Jenis Kartu Lainnya',
              orientation: 'landscape',
              primaryColor: '#153d49',
              secondaryColor: '#238f89',
              bgStyle: 'gradient',
              corner: 19,
              elements: [{ id: 'smoke-text', type: 'text', text: 'SMOKE TEST', x: 7, y: 17, w: 45, size: 12, color: '#ffffff', weight: 800 }],
            };
            const created = await request('/templates', {
              method: 'POST',
              body: JSON.stringify({
                name: template.name, category: template.category, status: 'draft',
                schemaVersion: template.schemaVersion, elements: template.elements,
                template_json: template, template,
              }),
            });
            const record = created.template || created;
            id = record.id;
            if (!id) throw new Error('Create response did not include a template ID');

            const list = await request('/templates');
            const items = Array.isArray(list.templates) ? list.templates : [];
            const saved = items.find(item => item.id === id);
            if (!saved) throw new Error('Created draft could not be read back for its workspace');

            const published = await request('/templates/' + encodeURIComponent(id), {
              method: 'PUT',
              body: JSON.stringify({
                name: template.name, category: template.category, status: 'published',
                schemaVersion: template.schemaVersion, elements: template.elements,
                template_json: template, template,
              }),
            });
            const updated = published.template || published;
            if (updated.status && updated.status !== 'published') throw new Error('Publish response status is not published');

            const publicList = await request('/templates');
            const publicItems = Array.isArray(publicList.templates) ? publicList.templates : [];
            if (!publicItems.some(item => item.id === id && item.status === 'published')) {
              throw new Error('Published template was not visible in the shared catalog');
            }
            console.log('PASS: health, create draft, read-back, publish, shared-catalog visibility');
          } finally {
            if (id) {
              try {
                await request('/templates/' + encodeURIComponent(id), { method: 'DELETE' });
                console.log('Cleanup: smoke-test template deleted');
              } catch (error) {
                console.error('Cleanup warning:', error.message);
                process.exitCode = 1;
              }
            }
          }
          NODE

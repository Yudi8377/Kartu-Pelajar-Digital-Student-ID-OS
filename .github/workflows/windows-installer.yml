name: Windows Desktop Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "windows-installer/**"
      - ".github/workflows/windows-installer.yml"
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: windows-installer/package.json
      - name: Install desktop packaging dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: digital-card-os-windows-installer
          path: windows-installer/dist/*.exe
          if-no-files-found: error
          retention-days: 14
